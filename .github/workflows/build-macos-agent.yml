name: Build macOS agent

# Builds the desktop agent's .app/.dmg on a macOS runner, since PyInstaller cannot
# cross-compile a macOS build from Windows or Linux. Triggerable manually and on
# changes to the agent itself, so the macOS build is kept honest without needing a
# physical Mac in the loop.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop-agent/**"
      - ".github/workflows/build-macos-agent.yml"

jobs:
  build:
    # Intel runner, not macos-latest: macos-latest is Apple Silicon (arm64) since
    # macOS 14, and PyInstaller can't cross-build — it only packages binaries for
    # the architecture it actually runs on. An arm64 build fails to launch at all
    # ("not supported on this Mac") on an Intel Mac, which is what this project's
    # actual test machine is. macos-13 (the old plain Intel image) was retired by
    # GitHub in December 2025; macos-15-intel is its direct replacement.
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: desktop-agent
    steps:
      - uses: actions/checkout@v4

      # Not actions/setup-python: its macOS Python builds bundle an old Tcl/Tk whose
      # Aqua color code calls a private AppKit selector newer macOS versions have
      # removed, aborting the whole process (SIGABRT, uncatchable from Python) the
      # instant tkinter creates its first window — confirmed on a real machine
      # running macOS 26. Homebrew's python-tk formula pulls in Homebrew's own
      # actively-maintained tcl-tk (>= 8.6.14, which carries the upstream fix for
      # exactly this), so PyInstaller bundles a Tcl/Tk that actually works.
      - name: Install Python (Homebrew, for a non-broken Tcl/Tk)
        run: |
          # `brew link` commonly fails here because the runner image already has a
          # python@3.12 symlinked into /usr/local/bin — harmless for us, since we
          # reference the Cellar binary directly below rather than relying on PATH.
          # The install itself (and this script's next line) is the real check.
          brew install python-tk@3.12 || true
          "$(brew --prefix python@3.12)/bin/python3.12" -c \
            "import tkinter; print('Tcl/Tk', tkinter.Tcl().eval('info patchlevel'))"

      - name: Install dependencies
        # --break-system-packages: Homebrew's Python marks itself externally-managed
        # (PEP 668) and refuses a bare `pip install` otherwise. A venv would be the
        # usual answer, but PyInstaller needs to run as this exact interpreter to
        # bundle the Tcl/Tk it resolves — a disposable CI runner is an acceptable
        # place to install straight into it.
        run: >-
          "$(brew --prefix python@3.12)/bin/python3.12" -m pip install
          --break-system-packages -r requirements-dev.txt

      - name: Build
        # Invoked via bash rather than ./installer/build_macos.sh: this repo is
        # checked out on Windows, which does not track the executable bit, so the
        # file arrives at git without +x regardless of what's set locally.
        run: PYTHON="$(brew --prefix python@3.12)/bin/python3.12" bash installer/build_macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: office-tracker-agent-macos
          path: desktop-agent/dist/OfficeTrackerSetup-*.dmg
          if-no-files-found: error
