name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        # Pinned to the major version the production target actually runs (10.23,
        # frozen there since that server can't be upgraded) rather than a current
        # version — CI passing against a newer Postgres than production would be
        # confidence in the wrong database.
        image: postgres:10-alpine
        env:
          POSTGRES_DB: office_management
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-secret-key
      POSTGRES_DB: office_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.10 is the newest Python Django 4.0 supports (see requirements.txt) — not
          # a preference, a ceiling.
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Privacy guard
        run: python scripts/check_privacy.py
        working-directory: .

      - name: Missing migrations check
        run: python manage.py makemigrations --check --dry-run

      - name: Deployment checks
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_DEBUG: "false"
          # Long enough to satisfy the check's own entropy rule. Not a real key: it is
          # never used to sign anything, because nothing here serves a request.
          DJANGO_SECRET_KEY: ci-only-not-a-real-key-4Xq8ZmWv2LpTr9NsBd6Ky3HaJgFcQw7Ez5Vu
          DJANGO_ALLOWED_HOSTS: ci.example.com

      - name: Tests
        run: pytest --cov --cov-report=term-missing

  desktop-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: desktop-agent/requirements-dev.txt

      # The agent ships for Windows, but everything except the win32 calls is pure
      # Python behind a boundary, so the logic that decides idle state, lifecycle events
      # and backoff is tested here on every push.
      - run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint (eslint)
        run: npx eslint src --ext .js,.vue --max-warnings 0

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  # Dependency audit for the Python halves. A separate job so a newly-published advisory
  # against a pinned version fails visibly on its own, rather than looking like the test
  # suite broke.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install pip-audit

      - name: Backend dependencies
        run: pip-audit --requirement backend/requirements.txt --progress-spinner off

      - name: Desktop agent dependencies
        run: pip-audit --requirement desktop-agent/requirements.txt --progress-spinner off

  # CI backstop for the local detect-private-key pre-commit hook, which only runs if a
  # contributor has pre-commit installed and can be bypassed with --no-verify. Scans the
  # full history on push so a secret introduced in an earlier, already-merged commit is
  # still caught, not just the current diff.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
