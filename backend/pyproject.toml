[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["migrations", ".venv", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]
ignore = [
    "S101",  # assert is how pytest works
    "B008",  # DRF and Django idioms call functions in defaults
]

[tool.ruff.lint.per-file-ignores]
"config/settings.py" = ["S105"]
"tests/*" = ["S105", "S106"]
"*/tests/*" = ["S105", "S106"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "tests.py"]
addopts = "--strict-markers"
testpaths = ["tests", "accounts", "core", "employees", "attendance", "computers", "activities", "reports"]

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "config/wsgi.py",
    "config/asgi.py",
    "manage.py",
    ".venv/*",
]
