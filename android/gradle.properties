org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Capped rather than left to Gradle's default (one per core): too many concurrent
# worker JVMs (dexing in particular) can exhaust available memory on a modest runner
# and crash the daemon outright, as it did once while scaffolding this project.
org.gradle.workers.max=2
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
